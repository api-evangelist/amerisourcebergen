domain_standards:
  - id: dscsa
    name: Drug Supply Chain Security Act (US, 21 U.S.C. 360eee)
    contract_declared: false
    operationally_claimed: true
    evidence: >-
      Cencora's pharmaceutical serialization page states it provides DSCSA- and FMD-compliant
      3PL serialization services; the newsroom publishes DSCSA compliance guidance. This is a
      marketing/program claim, not a contract declaration — no serialization data interface,
      EPCIS endpoint or message schema is published.
    source: https://www.cencora.com/solutions/pharmaceutical-serialization
  - id: eu-fmd
    name: EU Falsified Medicines Directive (2011/62/EU)
    contract_declared: false
    operationally_claimed: true
    evidence: Named alongside DSCSA on the same serialization solutions page.
    source: https://www.cencora.com/solutions/pharmaceutical-serialization
  - id: gs1-epcis
    name: GS1 EPCIS
    contract_declared: false
    operationally_claimed: false
    evidence: >-
      Not named anywhere in Cencora's public pages. A US wholesale distributor almost
      certainly exchanges EPCIS events under DSCSA, but nothing public says so and nothing
      was fabricated here.
  - id: gdpr
    name: EU General Data Protection Regulation
    contract_declared: false
    operationally_claimed: true
    evidence: The Global Privacy Statement references GDPR throughout and states data-subject rights.
    source: https://www.cencora.com/global-privacy-statement
compliance_program_published: false
compliance_note: >-
  No Compliance pointer is emitted. Cencora's quality-management-and-compliance page describes
  ISO 13485 / MDSAP / GMP consulting services it SELLS to clients, not certifications Cencora
  itself holds; trust.cencora.com exists but answers a Cloudflare bot challenge (HTTP 403), so
  no certification list could be read. Crediting either would be an over-claim.
