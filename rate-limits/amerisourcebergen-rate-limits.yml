description: >-
  Cencora (formerly AmerisourceBergen) publishes no rate-limit documentation. There is no
  public API reference to carry limits, no documented 429 semantics, and no RateLimit-* /
  X-RateLimit-* / Retry-After header contract, because every path on the API developer portal
  api.cencora.com returns an OAuth redirect before any documentation is reachable. EDI and
  ordering integrations are governed by bilateral SLAs in the master distribution agreement
  rather than by a published per-key throttling contract.
notes: >-
  limit_count is an honest zero, replacing the 2026-05-04 bulk-sweep scaffold that carried a
  placeholder "No Public Rate Limit Documentation" limit row. A placeholder that says a limit
  is undocumented is not a limit; it has been removed rather than counted.
