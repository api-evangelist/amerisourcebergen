    properties:
      - type: Website
        url: https://www.amerisourcebergen.com
    description: >-
      AmerisourceBergen (now Cencora) is one of the largest global pharmaceutical
      distributors, serving pharmaceutical manufacturers, healthcare providers, and
      patients worldwide. The company does not currently publish a public developer API reference. Its API developer
      portal is gated (see the Cencora API Developer Portal entry below).
  - aid: amerisourcebergen:developer-portal
    name: Cencora API Developer Portal
    tags:
      - Developer Portal
      - API Management
      - Pharmaceutical Distribution
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://api.cencora.com
    humanURL: https://api.cencora.com
    properties:
      - type: Portal
        url: https://api.cencora.com
      - type: Authentication
        url: authentication/amerisourcebergen-authentication.yml
      - type: OAuthScopes
        url: scopes/amerisourcebergen-scopes.yml
    description: >-
      Cencora operates an SAP API Business Hub Enterprise developer portal at api.cencora.com —
      DNS resolves to ab-cloud-foundry-prd.apibhubenterprise.cfapps.us21.hana.ondemand.com, and
      every request, on every path, returns an HTML shim that redirects to the SAP XSUAA
      authorization server with client_id sb-dev-portal-xsuaa!b33 and PKCE S256. The portal is
      real and live, but no API catalogue, reference, contract or tool listing is reachable
      without credentials, and Cencora publishes no page describing how a developer obtains
      them. Probed 2026-09-02.
