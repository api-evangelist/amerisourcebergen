  reason: partner-login
  detail: >-
    Cencora runs a real SAP API Business Hub Enterprise developer portal at api.cencora.com,
    but every path on that host — including /openapi.json, /.well-known/* and a control path
    that cannot exist — returns the same 858-byte HTML shim redirecting to SAP XSUAA OAuth
    (client_id sb-dev-portal-xsuaa!b33), so no catalogue, reference or contract is readable
    without portal credentials Cencora publishes no way to request.
