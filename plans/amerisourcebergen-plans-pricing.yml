description: >-
  Cencora (formerly AmerisourceBergen) publishes no API plans, no pricing page and no
  self-service sign-up. /pricing, /plans and /signup all 404 on www.cencora.com. Every
  commercial route on the site terminates in a "Connect with us" / "Contact sales" form,
  and the API developer portal at api.cencora.com is behind SAP XSUAA login before any
  catalogue, tier or price is visible. Integrations (EDI, ordering, inventory, returns)
  are contracted bilaterally under master distribution agreements.
notes: >-
